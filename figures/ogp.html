<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>loop-engineering-playbook</title>
<!--
  GitHub のソーシャルプレビュー（OGP）の画像。中身は README の図（loop.html）の黒地版そのもの
  黒地にした理由: OGP は見る人の設定に関係なく1枚しか出せない、見出しの色が強く出てライトモードの画面で目立つ
  loop.html を縦横比 2:1（GitHub の推奨 1280 × 640 と同じ比）の枠に、高さを合わせて縮めて中央に置く
  中身を複製しないので、loop.html を直したらこのファイルは触らずに描き出し直すだけでよい
  1920 × 960 の枠 ／ loop.html は 1920 × 1500 → 0.64 倍で高さ 960
  iframe の幅は 1925（0.64 倍で 1232）・左は 344 ── 端を整数ピクセルにそろえる、小数だと境目に薄い縦線がにじむ（実際に起きた）
-->
<style>
  html, body { margin: 0; background: #111111; }
  .page { position: relative; width: 1920px; height: 960px; background: #111111; overflow: hidden; }
  iframe { position: absolute; left: 344px; top: 0; width: 1925px; height: 1500px; border: 0; transform: scale(0.64); transform-origin: 0 0; }
</style>
</head>
<body>
<div class="page"><iframe src="loop.html#dark" scrolling="no"></iframe></div>
</body>
</html>
